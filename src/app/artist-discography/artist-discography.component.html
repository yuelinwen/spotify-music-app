<div class="error" *ngIf="error">{{error}}</div>

<h2>{{artist?.name}}</h2>
<p>Full discography for {{artist?.name}}<br>
    Click the <strong>album cover</strong> for more information.</p>
<mat-card *ngIf="artist?.images?.length" [style.background]="'url(' +
    (artist.images[1] || artist.images[0]).url + ')
    no-repeat center center'" [style.background-size]="'cover'" [style.height]="'450px'">
</mat-card>

<br /><br />
<h1 *ngIf="artist">Full Discography</h1>

<div fxLayout="row wrap" fxLayout.xs="column">

    <!-- Single "Responsive" Card-->
    <div fxFlex [style.margin]="'20px'" *ngFor="let album of albums">
        <mat-card [style.min-width]="'200px'">
            <mat-card-header>
                <mat-card-title>{{album.name}}</mat-card-title>
                <mat-card-subtitle>Album Title</mat-card-subtitle>
            </mat-card-header>
            <img *ngIf="album.images?.length" mat-card-image class="album-cover"
                src="{{ album.images[0].url }}" alt="album art" [routerLink]="['/album',album.id]">

            <strong>Release Date: </strong>{{album.release_date}}<br />
            <strong>Tracks: </strong>{{album.total_tracks}}
        </mat-card>
    </div>
    <!-- -->

</div>
