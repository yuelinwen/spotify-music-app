<div class="navbar-container">

  <!-- Top navbar -->
  <mat-toolbar class="navbar" color="primary">

    <button mat-icon-button (click)="snav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>

    <a class="navbar-brand" matTooltip="Home" routerLink="newReleases">
      <h1>
        Spotify Music
      </h1>
    </a>

    <span class="navbar-spacer"></span>

    <button mat-button [matMenuTriggerFor]="userMenu" *ngIf="token">
      <mat-icon>person</mat-icon>
      <span fxShow fxHide.xs>
        {{ token.userName }}
      </span>
    </button>
    <mat-menu #userMenu="matMenu" xPosition="before" yPosition="above" [overlapTrigger]="false">

      <a mat-menu-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Log out</span>
      </a>

    </mat-menu>

    <!-- Signed out: browsing and listening need no account, so offer the way
         in rather than hiding the app behind it. -->
    <ng-container *ngIf="!token">
      <a mat-button routerLink="/login">
        <mat-icon>login</mat-icon>
        <span fxShow fxHide.xs>&nbsp;Log in</span>
      </a>
      <a mat-button routerLink="/register">
        <mat-icon>account_box</mat-icon>
        <span fxShow fxHide.xs>&nbsp;Register</span>
      </a>
    </ng-container>

  </mat-toolbar>

  <mat-sidenav-container>
    <!-- Side nav -->
    <mat-sidenav #snav [mode]="'side'" [fixedInViewport]="true" fixedTopGap="56">

      <mat-nav-list>
        <div>
          <mat-form-field appearance="fill">
            <mat-label>Artist</mat-label>
            <form (ngSubmit)='handleSearch()'><input matInput type="text" name="searchString"
                [(ngModel)]='searchString'></form>
            <mat-icon matSuffix>search</mat-icon>
          </mat-form-field>
        </div>


        <a mat-list-item routerLink="/newReleases">
          <mat-icon mat-list-icon>
            library_music
          </mat-icon>
          <p mat-line> New Releases </p>
        </a>

        <a mat-list-item routerLinkActive="active" [routerLink]="['/favourites']">
          <mat-icon mat-list-icon>
            favorite
          </mat-icon>
          <p mat-line> Favourites </p>
        </a>

        <mat-divider></mat-divider>

        <a id="push-bottom" mat-list-item routerLink="/about">
          <mat-icon mat-list-icon>
            info_outline
          </mat-icon>
          <p mat-line> About </p>
        </a>
      </mat-nav-list>

    </mat-sidenav>

    <mat-sidenav-content class="sidenav-content">

      <!-- Main content -->
      <router-outlet></router-outlet>
      <!-- ------------ -->

      <div class="bottom-spacer"></div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
