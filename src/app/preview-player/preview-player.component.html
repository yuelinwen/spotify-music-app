<div class="preview">
  <ng-container *ngIf="track?.previewUrl; else noPreview">
    <audio controls preload="none" [src]="track.previewUrl"></audio>
    <div class="preview-note">
      Preview provided courtesy of iTunes &middot;
      <a *ngIf="track.url" [href]="track.url" target="_blank" rel="noopener">Listen on Apple Music</a>
    </div>
  </ng-container>

  <ng-template #noPreview>
    <span class="preview-note">No preview available for this track</span>
  </ng-template>
</div>
