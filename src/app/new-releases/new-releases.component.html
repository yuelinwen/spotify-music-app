<div class="error" *ngIf="error">{{error}}</div>

<h2>New Releases</h2>
<p>The following is a list of albums currently charting on Apple Music. <br>
    Click the album cover or artist name for more information</p>
<div class="content">
    <div fxLayout="row wrap" fxLayout.xs="column">

        <!-- Single "Responsive" Card-->
        <div fxFlex [style.margin]="'20px'" *ngFor="let release of releases">
            <mat-card [style.min-width]="'200px'">
                <mat-card-header>
                    <mat-card-title>{{release.name}}</mat-card-title>
                    <mat-card-subtitle>{{release.genre}}</mat-card-subtitle>
                </mat-card-header>
                <img *ngIf="release.artwork" mat-card-image class="album-cover" [src]="release.artwork"
                    alt="album art" [routerLink]="['/album',release.id]">

                <strong>Release Date: </strong>{{release.releaseDate}}<br /><br />
                <mat-card-content>
                    <mat-chip-list aria-label="Artist selection">
                        <mat-chip [routerLink]="['/artist', release.artistId]">{{release.artistName}}</mat-chip>
                    </mat-chip-list>
                </mat-card-content>
            </mat-card>
        </div>
        <!-- -->

    </div>
</div>
